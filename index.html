
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balap Robot Cerdas - Individu</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#edf4ff;color:#173153}
header{background:#173f80;color:white;text-align:center;padding:20px}
header h1{margin:0;font-size:clamp(24px,5vw,36px)}
main{max-width:760px;margin:auto;padding:16px}
.panel{background:white;padding:18px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 12px #1232}
h2{margin-top:0}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:12px;border:1px solid #b8c8dd;border-radius:8px;font-size:16px}
button{font-family:inherit;font-size:16px;cursor:pointer;border:0;border-radius:9px;padding:12px}
.primary{background:#1769d2;color:white;font-weight:bold}
.secondary{background:#e4ecf8;color:#173f80}
button:disabled{opacity:.6;cursor:default}
.full{width:100%;margin-top:14px}
.robotbox{background:#d9edff;border-radius:12px;padding:14px;margin-bottom:15px}
.track{height:28px;background:#fff;border:1px solid #ccd2dc;border-radius:20px;overflow:hidden;margin-top:8px}
.runner{height:100%;width:0%;background:#3188e8;transition:width .4s}
.qtext{font-size:18px;line-height:1.5;margin:18px 0}
.answers{display:grid;gap:9px}
.answer{background:white;border:2px solid #d9e4f2;text-align:left;color:#173153;line-height:1.4}
.answer.right{background:#c8f1d2;border-color:#208743}
.answer.wrong{background:#ffd3d3;border-color:#d33}
.feedback{line-height:1.6;margin-top:14px;font-weight:bold}
.muted{color:#60718a;font-size:14px;line-height:1.5}
.hidden{display:none}
.score{font-size:28px;font-weight:bold;color:#1769d2}
</style>
</head>
<body>
<header>
<h1>🤖 BALAP ROBOT CERDAS 🏁</h1>
<p>Jawab soal, kumpulkan poin, dan capai garis finis!</p>
</header>
<main>
<section class="panel" id="identity">
<h2>👩‍🎓 Identitas Siswa</h2>
<p>Isi identitas dengan benar sebelum memulai.</p>
<label for="nama">Nama lengkap</label>
<input id="nama" autocomplete="name" placeholder="Masukkan nama lengkap">
<label for="kelas">Kelas</label>
<select id="kelas">
<option value="">-- Pilih kelas --</option>
<option>VII</option><option>VIII</option><option>IX</option>
</select>
<label for="absen">Nomor absen</label>
<input id="absen" type="number" min="1" max="60" placeholder="Masukkan nomor absen">
<button class="primary full" onclick="startGame()">🚦 Mulai Balapan</button>
<p class="muted">Kerjakan sendiri dengan teliti. Game ini memilih 10 soal secara acak.</p>
</section>

<section class="panel hidden" id="game">
<div class="robotbox">
<div><strong>🤖 Robot Biru</strong> <span id="robotScore">0 poin</span></div>
<div class="track"><div class="runner" id="runner"></div></div>
<p class="muted" id="progress">Soal 1 dari 10</p>
</div>
<h2 id="questionTitle">Soal 1</h2>
<div class="qtext" id="question"></div>
<div class="answers" id="answers"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<button class="primary full hidden" id="nextBtn" onclick="nextQuestion()">Soal Berikutnya ➜</button>
</section>

<section class="panel hidden" id="result">
<h2>🏆 Hasil Balapan</h2>
<p id="studentResult"></p>
<div class="score" id="finalScore"></div>
<p id="correctCount"></p>
<p id="saveStatus" class="muted">Mengirim hasil...</p>
<button class="secondary full" onclick="location.reload()">Selesai</button>
</section>
</main>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwqcaaSOWH14aPX3HCjaZ3TrskPi6iUHdkjE-RAAKbjnK5lo45Jc07RPYXKwJLdYID0/exec";

const bank = [
{q:"Ikan yang memiliki tubuh licin dan kumis panjang adalah ....",a:["Ikan bandeng","Ikan lele","Ikan tenggiri","Ikan tuna"],c:1,e:"Ikan lele memiliki tubuh licin dan sungut di sekitar mulut."},
{q:"Ikan bandeng banyak dibudidayakan di perairan ....",a:["Air payau","Gurun","Pegunungan","Air terjun"],c:0,e:"Bandeng banyak dibudidayakan di tambak air payau."},
{q:"Bandeng presto dimasak menggunakan ....",a:["Pembekuan","Pengeringan saja","Tekanan tinggi","Pengasinan saja"],c:2,e:"Tekanan tinggi membantu melunakkan duri bandeng."},
{q:"Ikan tenggiri memiliki ciri tubuh ....",a:["Bulat seperti bola","Berbulu","Sangat pendek","Memanjang dan kuat"],c:3,e:"Tenggiri memiliki tubuh memanjang dan berenang cepat."},
{q:"Udang rebon sering digunakan sebagai bahan pembuatan ....",a:["Keju","Terasi","Mentega","Yoghurt"],c:1,e:"Udang rebon banyak dimanfaatkan untuk membuat terasi."},
{q:"Udang windu dikenal memiliki ....",a:["Bulu tebal","Sayap","Corak belang","Kaki seperti burung"],c:2,e:"Udang windu dikenal memiliki corak belang pada tubuhnya."},
{q:"Lengan dan tentakel cumi-cumi membantu untuk ....",a:["Menangkap mangsa","Menghasilkan susu","Berjalan di darat","Membuat sarang"],c:0,e:"Lengan dan tentakel membantu cumi-cumi menangkap mangsa."},
{q:"Salah satu cara mengolah cumi-cumi adalah ....",a:["Mencampurnya dengan tanah","Menyimpan di pasir","Membekukan selamanya","Memanggang hingga matang"],c:3,e:"Cumi-cumi dapat dipanggang hingga matang."},
{q:"Tubuh rumput laut yang tidak memiliki akar, batang, dan daun sejati disebut ....",a:["Akar tunggang","Talus","Biji","Umbi"],c:1,e:"Tubuh rumput laut disebut talus."},
{q:"Rumput laut tertentu dapat dimanfaatkan untuk membuat ....",a:["Batu bata","Bensin","Agar-agar","Besi"],c:2,e:"Jenis rumput laut tertentu digunakan untuk membuat agar-agar."},
{q:"Hewan yang termasuk hasil perikanan adalah ....",a:["Kambing","Sapi","Ayam","Udang"],c:3,e:"Udang merupakan hasil perikanan."},
{q:"Telur dan susu termasuk hasil ....",a:["Pertambangan","Peternakan","Perkebunan","Kehutanan"],c:1,e:"Telur dan susu merupakan hasil peternakan."},
{q:"Ikan yang hidup di laut termasuk ikan ....",a:["Air laut","Air tawar saja","Pegunungan","Kolam saja"],c:0,e:"Ikan laut hidup di perairan laut."},
{q:"Bahan pangan yang berasal dari peternakan adalah ....",a:["Rumput laut","Cumi-cumi","Daging ayam","Udang"],c:2,e:"Daging ayam merupakan hasil peternakan."},
{q:"Sebelum mengolah ikan, bahan pangan sebaiknya ....",a:["Dibiarkan kotor","Dicuci dan dibersihkan","Dicampur tanah","Diletakkan di lantai"],c:1,e:"Bahan pangan perlu dibersihkan sebelum diolah."},
{q:"Salah satu tujuan mengolah bahan pangan adalah ....",a:["Membuatnya selalu kotor","Menghilangkan semua gizi","Membuatnya tidak layak makan","Menghasilkan makanan siap dikonsumsi"],c:3,e:"Pengolahan membantu membuat bahan pangan siap dikonsumsi."},
{q:"Udang, cumi-cumi, dan ikan termasuk sumber pangan ....",a:["Perikanan","Pertambangan","Kehutanan","Batuan"],c:0,e:"Ikan, udang, dan cumi-cumi merupakan hasil perikanan."},
{q:"Salah satu cara menjaga mutu bahan pangan adalah ....",a:["Membiarkannya terbuka","Menyimpannya dengan tepat","Mencampurnya dengan sampah","Membiarkannya terkena hama"],c:1,e:"Penyimpanan yang tepat membantu menjaga mutu bahan pangan."},
{q:"Alat yang digunakan untuk memotong bahan makanan adalah ....",a:["Penghapus","Penggaris","Pisau","Pensil"],c:2,e:"Pisau digunakan untuk memotong bahan makanan dengan hati-hati."},
{q:"Saat mengolah bahan pangan, kita perlu menjaga ....",a:["Lantai tetap kotor","Bahan tercampur sampah","Tangan tidak dicuci","Kebersihan dan keamanan"],c:3,e:"Kebersihan dan keamanan penting dalam pengolahan pangan."}
];

let siswa={}, questions=[], index=0, score=0, locked=false;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startGame(){
  const nama=document.getElementById("nama").value.trim();
  const kelas=document.getElementById("kelas").value;
  const absen=document.getElementById("absen").value.trim();
  if(!nama||!kelas||!absen||Number(absen)<1){
    alert("Lengkapi nama, kelas, dan nomor absen terlebih dahulu.");
    return;
  }
  siswa={nama,kelas,absen};
  questions=shuffle(bank).slice(0,10);
  index=0;score=0;
  document.getElementById("identity").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  locked=false;
  const q=questions[index];
  document.getElementById("questionTitle").textContent="Soal "+(index+1)+" dari 10";
  document.getElementById("progress").textContent="Soal "+(index+1)+" dari 10";
  document.getElementById("question").textContent=q.q;
  document.getElementById("feedback").textContent="";
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("answers").innerHTML="";
  const options=shuffle(q.a.map((text,i)=>({text,correct:i===q.c})));
  options.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=String.fromCharCode(65+i)+". "+o.text;
    b.onclick=()=>chooseAnswer(b,o,options);
    document.getElementById("answers").appendChild(b);
  });
}

function chooseAnswer(button,option,options){
  if(locked)return;
  locked=true;
  const q=questions[index];
  document.querySelectorAll(".answer").forEach(b=>b.disabled=true);
  const buttons=[...document.querySelectorAll(".answer")];
  options.forEach((o,i)=>{if(o.correct)buttons[i].classList.add("right");});
  if(option.correct){
    score+=10;
    document.getElementById("feedback").textContent="✅ Benar! +10 poin. "+q.e;
  }else{
    button.classList.add("wrong");
    document.getElementById("feedback").textContent="❌ Belum tepat. "+q.e;
  }
  document.getElementById("robotScore").textContent=score+" poin";
  document.getElementById("runner").style.width=(score/100*100)+"%";
  document.getElementById("nextBtn").textContent=index===9?"Lihat Hasil 🏆":"Soal Berikutnya ➜";
  document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion(){
  if(!locked)return;
  index++;
  if(index<10){showQuestion();return;}
  endGame();
}

function endGame(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("studentResult").textContent=
    siswa.nama+" • Kelas "+siswa.kelas+" • Absen "+siswa.absen;
  document.getElementById("finalScore").textContent=score+" / 100";
  document.getElementById("correctCount").textContent=
    "Jawaban benar: "+(score/10)+" dari 10 soal.";
  document.getElementById("saveStatus").textContent=
    "Sedang mengirim nilai ke Google Sheets...";

  const data={
    nama:siswa.nama,
    kelas:siswa.kelas,
    absen:siswa.absen,
    benar:score/10,
    jumlahSoal:10,
    nilai:score
  };

  fetch(SHEET_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(data)
  }).then(()=>{
    document.getElementById("saveStatus").textContent=
      "Permintaan pengiriman telah dikirim. Silakan periksa Google Sheets untuk memastikan nilai tercatat.";
  }).catch(()=>{
    document.getElementById("saveStatus").textContent=
      "Pengiriman mungkin gagal. Periksa koneksi internet dan Google Sheets.";
  });
}
</script>
</body>
</html>
